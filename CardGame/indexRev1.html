<!DOCTYPE html>
<html>

<head>
    <title>Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <select id="playerGender">
        <option>Male</option>
        <option>Female</option>
    </select>

    <select id="partnerGender">
        <option>Female</option>
        <option>Male</option>
    </select>

    <br><br>

    <button id="increaseButton">Increase Intensity</button>
    <button id="decreaseButton">Decrease Intensity</button>

    <button id="drawButton">Draw Card</button>

    <button id="successButton">Task Completed</button>
    <button id="failButton">Task Not Completed</button>

    <button id="continueButton">Continue Game</button>

    <br><br>

    <textarea id="output" rows="25" cols="100"></textarea>

    <script src="game.js"></script>


</body>

</html>
